name: Test build (Windows)

# Unsigned Windows test build: the Nudgy installer plus the one-file server
# (nudgy-server.exe). Runs for a pushed `test-*` tag, a commit whose message contains
# "[build windows]", or a manual run. The files land in a DRAFT release (only visible to people
# with access to this repository) and as a workflow artifact.
# Windows will warn about an unknown publisher: More info → Run anyway.

on:
  push:
    tags: ["test-*"]
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    if: >-
      startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[build windows]')
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri

      - name: Build the app (NSIS installer)
        working-directory: app
        run: npm run tauri build -- --bundles nsis

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Build the server (nudgy-server.exe)
        working-directory: backend
        run: |
          pip install . pyinstaller
          pyinstaller --noconfirm nudgy-server.spec

      - name: Collect files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out | Out-Null
          Copy-Item app/src-tauri/target/release/bundle/nsis/*.exe out/
          Copy-Item backend/dist/nudgy-server.exe out/
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: nudgy-windows-test
          path: out/

      - name: Draft release with the files
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          prerelease: true
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('test-build-{0}', github.run_number) }}
          target_commitish: ${{ github.sha }}
          name: Nudgy test build ${{ github.run_number }}
          files: out/*
          body: |
            Unsigned test build for Windows.
            1. Run `nudgy-server.exe` (keep its window open). First run creates a `.env` next to it: put your keys there, then restart it.
            2. Install Nudgy with the setup file (Windows may say "unknown publisher": More info → Run anyway).
            3. Open Nudgy, hold Ctrl+Alt+Space and ask.
