# Plans live in config, not code. Stripe price/coupon IDs come from the environment
# (STRIPE_PRICE_PRO, STRIPE_PRICE_TEAM, STRIPE_COUPON_STUDENT) so test/live modes differ by env.
#
# Paid plans have no limits at all. The free plan's only limit is the monthly lesson cap,
# which applies after the free-access window ends (FREE_UNTIL) and is a runtime setting
# (app_settings.free_tier_lessons_per_month), not a value in this file. See services/access.py.
plans:
  free:
    name: Free
    paid: false
    features: { share_links: true, team_library: false }
  pro:
    name: Pro
    paid: true
    stripe_price_env: STRIPE_PRICE_PRO
    features: { share_links: true, team_library: false }
  team:
    name: Team
    paid: true
    stripe_price_env: STRIPE_PRICE_TEAM
    per_seat: true
    features: { share_links: true, team_library: true }

coupons:
  student: { stripe_coupon_env: STRIPE_COUPON_STUDENT }
