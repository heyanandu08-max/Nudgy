<!doctype html>
<!-- Stand-in for a Notepad window, rendered to notepad.jpg for the smoke test. -->
<html><head><style>
  body{margin:0;width:1280px;height:720px;background:#1f6feb33;font:14px "Segoe UI",sans-serif}
  .win{position:absolute;left:80px;top:40px;width:1120px;height:640px;background:#fff;border:1px solid #999;box-shadow:0 8px 30px #0003}
  .title{height:32px;display:flex;align-items:center;padding:0 12px;background:#f3f3f3;border-bottom:1px solid #ddd}
  .menu{height:28px;display:flex;gap:4px;padding:0 8px;align-items:center;border-bottom:1px solid #eee}
  .menu span{padding:4px 10px;border-radius:4px}
  .menu span.open{background:#e5f1fb}
  .drop{position:absolute;left:150px;top:62px;width:200px;background:#fff;border:1px solid #ccc;box-shadow:0 4px 12px #0002}
  .drop div{padding:6px 16px}
  textarea{position:absolute;left:0;top:62px;width:1100px;height:560px;border:0;padding:10px;font:16px Consolas,monospace;resize:none}
</style></head><body>
<div class="win">
  <div class="title">notes.txt - Notepad</div>
  <div class="menu"><span>File</span><span>Edit</span><span class="open">Format</span><span>View</span><span>Help</span></div>
  <textarea>Shopping list
- milk
- coffee</textarea>
  <div class="drop"><div>Word Wrap</div><div>Font...</div></div>
</div>
</body></html>
