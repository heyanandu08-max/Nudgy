[package]
name = "nudgy"
version = "0.1.0"
description = "Nudgy — an AI tutor that lives next to your cursor"
edition = "2021"
rust-version = "1.77"

[lib]
name = "nudgy_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png", "macos-private-api"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"
env_logger = "0.11"
tauri-plugin-global-shortcut = "2"
cpal = "0.17.1"
hound = "3.5.1"
xcap = "0.9.8"
base64 = "0.23.1"
futures-util = "0.3.34"
image = { version = "0.25.6", default-features = false, features = ["jpeg", "png"] }
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
reqwest = { version = "0.13.3", default-features = false, features = ["native-tls", "stream", "multipart", "json", "system-proxy"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
device_query = "4.0.1"
uuid = { version = "1.20.0", features = ["v4"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tempfile = "3"

[target.'cfg(target_os = "windows")'.dependencies]
uiautomation = "0.25.1"
windows-sys = { version = "0.61.2", features = ["Win32_UI_WindowsAndMessaging", "Win32_Foundation"] }

[target.'cfg(target_os = "macos")'.dependencies]
accessibility-sys = "0.2.0"
core-foundation = "0.10.1"
